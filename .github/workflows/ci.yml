name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Backend + ML (pytest, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend + dev dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Install CPU PyTorch stack (enables torch-marked tests)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r ml/requirements.txt
      - name: Lint
        run: ruff check ml backend tests scripts
      - name: Migrations apply on a fresh SQLite database
        run: python -m alembic -c backend/alembic.ini upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db
      - name: Tests
        run: python -m pytest tests -q

  web:
    name: Frontend (tsc, eslint, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

  e2e:
    name: End-to-end (Playwright, trained quality pilot)
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r backend/requirements.txt
      - name: Install CPU quality inference dependencies
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install timm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: python scripts/make_sample_images.py
      - name: Start backend (mock mode)
        run: |
          nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/health && break || sleep 1; done
        env:
          MODEL_MODE: mock
      - name: Verify trained quality model is ready
        run: |
          python - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8000/api/v1/quality/status', timeout=60) as response:
              status = json.load(response)
          assert status['status'] == 'ready', status['message']
          assert status['protocol']['transfer_learning']['route'] == 'progressive'
          assert status['protocol']['matching_encoder'] == 'timm_convnext_tiny'
          print('Trained quality model ready:', status['matching']['installed_name'])
          PY
      - name: Build and start frontend (proxy mode)
        run: |
          npm run build
          nohup npm run start > frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000 >/dev/null && break || sleep 1; done
        env:
          NEXT_PUBLIC_API_URL: ""
          BACKEND_INTERNAL_URL: http://127.0.0.1:8000
      - run: npx playwright test --project=desktop
      - if: failure()
        run: |
          echo "--- backend.log"; tail -100 backend.log
          echo "--- frontend.log"; tail -100 frontend.log
